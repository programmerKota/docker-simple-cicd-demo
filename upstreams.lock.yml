schema_version: 3
updated_at: 2026-07-13
policy: >-
  Upstreams are pinned before executable integration. Promotion requires license
  review, an immutable tag or commit and image digest, vulnerability scanning,
  compatibility tests, and a documented rollback path.

components:
  openjarvis:
    repository: https://github.com/open-jarvis/OpenJarvis
    revision: 6240c59ca3305c5656075cc54cd7ff32df8dca0e
    role: intelligence-runtime
    license: Apache-2.0
    status: selected-pinned

  mcp_python_sdk:
    repository: https://github.com/modelcontextprotocol/python-sdk
    revision: v1.28.1
    role: authenticated-ai-tool-protocol
    license: MIT
    status: selected-pinned

  home_assistant:
    repository: https://github.com/home-assistant/core
    revision: pending-target-installation-pin
    role: physical-home-control-plane
    license: Apache-2.0
    status: selected
    note: Pin the actual installed release after the target Home Assistant deployment is inventoried.

  opa:
    repository: https://github.com/open-policy-agent/opa
    revision: v1.18.2
    image: openpolicyagent/opa:1.18.2-static
    role: pre-action-policy-decision-point
    license: Apache-2.0
    status: selected-pinned

  dbos_python:
    repository: https://github.com/dbos-inc/dbos-transact-py
    revision: v2.26.0
    package: dbos==2.26.0
    role: durable-physical-workflows
    license: MIT
    status: selected-pinned

  postgres:
    repository: https://github.com/docker-library/postgres
    revision: 18.2-bookworm
    image: postgres:18.2-bookworm
    role: dbos-system-database
    license: PostgreSQL
    status: selected-tag-pinned
    note: Resolve and record the multi-architecture image digest before production promotion.

  nats:
    repository: https://github.com/nats-io/nats-server
    revision: pending-executable-pin
    role: durable-event-bus
    license: Apache-2.0
    status: selected-next

  brick:
    repository: https://github.com/BrickSchema/Brick
    revision: pending-executable-pin
    role: household-semantic-model
    license: BSD-3-Clause
    status: selected-next

  oxigraph:
    repository: https://github.com/oxigraph/oxigraph
    revision: pending-executable-pin
    role: embedded-rdf-and-sparql-store
    license: MIT-or-Apache-2.0
    status: selected-next

  livekit:
    repository: https://github.com/livekit/livekit
    revision: pending-executable-pin
    role: realtime-remote-voice-and-multimodal-transport
    license: Apache-2.0
    status: selected-optional

  frigate:
    repository: https://github.com/blakeblackshear/frigate
    revision: pending-executable-pin
    role: local-vision-and-nvr
    license: MIT
    status: selected-optional

  restic:
    repository: https://github.com/restic/restic
    revision: v0.19.1
    role: encrypted-verifiable-backup
    license: BSD-2-Clause
    status: selected-pinned

  temporal:
    repository: https://github.com/temporalio/temporal
    revision: not-pinned
    role: large-scale-durable-workflows
    license: MIT
    status: deferred
    reason: Maturity leader, but a larger operational control plane than the first single-home deployment requires.

  restate:
    repository: https://github.com/restatedev/restate
    revision: not-pinned
    role: lightweight-durable-services
    license: BSL-1.1
    status: deferred
    reason: Excellent technical fit, but not the default open-product foundation because the server is source-available rather than OSI open source.

  cedar:
    repository: https://github.com/cedar-policy/cedar
    revision: not-pinned
    role: analyzable-authorization-language
    license: Apache-2.0
    status: deferred
    reason: Retained for a future formal-verification profile; OPA is more operationally mature for the first executable integration.

  eclipse_ditto:
    repository: https://github.com/eclipse-ditto/ditto
    revision: not-pinned
    role: large-scale-digital-twin-platform
    license: EPL-2.0
    status: deferred
    reason: Excess operational weight for the first single-home deployment.

  openclaw:
    repository: https://github.com/openclaw/openclaw
    revision: not-pinned
    role: alternative-general-agent-runtime
    license: MIT
    status: runtime-rejected
    reason: Duplicate runtime and unnecessary attack surface; reviewed skills may be imported through OpenJarvis.
