name: CI

on:
  push:
    branches: [main, assembly-v2]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run all quality gates
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          status=0
          ruff check . 2>&1 | tee ruff.log || status=1
          mypy jarvis_home 2>&1 | tee mypy.log || status=1
          pytest --cov=jarvis_home --cov-report=term-missing 2>&1 | tee pytest.log || status=1
          pip-audit --skip-editable 2>&1 | tee pip-audit.log || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python-version }}-diagnostics
          path: |
            ruff.log
            mypy.log
            pytest.log
            pip-audit.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce quality result
        if: steps.quality.outcome == 'failure'
        run: exit 1

  durable-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.2-bookworm
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_USER: jarvis_test
          POSTGRES_PASSWORD: jarvis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_test -d jarvis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DBOS_DATABASE_URL: postgresql://jarvis_test:jarvis_test_password@127.0.0.1:5432/jarvis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run DBOS approval workflow integration
        id: durable_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -s tests/integration/test_dbos_light_workflow.py 2>&1 | tee durable-integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-integration-diagnostics
          path: durable-integration.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce durable integration result
        if: steps.durable_test.outcome == 'failure'
        run: exit 1

  event-integration:
    runs-on: ubuntu-latest
    env:
      TEST_NATS_URL: nats://127.0.0.1:4222
      TEST_NATS_TOKEN: ci-nats-token-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Start authenticated JetStream
        run: >-
          docker run -d --name nats-test -p 4222:4222
          nats:2.14.3-alpine -js --auth "$TEST_NATS_TOKEN"
      - name: Wait for NATS
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import os
          import nats

          async def wait():
              for _ in range(30):
                  try:
                      nc = await nats.connect(
                          os.environ["TEST_NATS_URL"],
                          token=os.environ["TEST_NATS_TOKEN"],
                          connect_timeout=1,
                      )
                      await nc.close()
                      return
                  except Exception:
                      await asyncio.sleep(1)
              raise SystemExit("NATS did not become ready")

          asyncio.run(wait())
          PY
      - name: Run JetStream replay integration
        id: event_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -vv -s tests/integration/test_jetstream_outbox.py 2>&1 | tee event-integration.log
      - name: Save NATS server log
        if: always()
        run: docker logs nats-test > nats-server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-integration-diagnostics
          path: |
            event-integration.log
            nats-server.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce event integration result
        if: steps.event_test.outcome == 'failure'
        run: exit 1

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deny-by-default household policies
        id: opa_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/policies:/policies:ro" \
            openpolicyagent/opa:1.18.2-static \
            test /policies -v 2>&1 | tee opa-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opa-test-diagnostics
          path: opa-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce policy test result
        if: steps.opa_test.outcome == 'failure'
        run: exit 1

  assembly-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/bootstrap_config.py
      - run: docker compose --env-file .env -f deploy/assembly/docker-compose.yml config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: jarvis-home:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  upstream-openjarvis:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: https://github.com/open-jarvis/OpenJarvis.git#6240c59ca3305c5656075cc54cd7ff32df8dca0e
          file: deploy/docker/Dockerfile
          push: false
          tags: jarvis-home-openjarvis-compat:test
          cache-from: type=gha,scope=openjarvis
          cache-to: type=gha,mode=max,scope=openjarvis
