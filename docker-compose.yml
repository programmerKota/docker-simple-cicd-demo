services:
  jarvis:
    build: .
    container_name: jarvis-home
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./plugins:/app/plugins:ro
      - ./master.key:/app/master.key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
